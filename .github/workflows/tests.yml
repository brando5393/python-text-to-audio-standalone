name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows-only: the app itself is Windows-specific (sounddevice/PortAudio playback,
    # Piper's Windows binary, pyttsx3/SAPI), so a Linux/macOS runner couldn't exercise
    # any of it for real. windows-latest has no real audio output device, which is why
    # AudioPlayer's tests mock sounddevice.OutputStream rather than needing one.
    runs-on: windows-latest
    strategy:
      matrix:
        # 3.10 dropped: numpy only publishes win_arm64 wheels from 2.5 onward, which
        # requires Python >=3.12 -- see pyproject.toml's `python` constraint comment.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest tests/ -v
