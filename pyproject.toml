[tool.poetry]
name = "talebrew"
version = "0.1.0"
description = "Talebrew: every story, brewed aloud. Converts text, PDF, and ebook files to audio using offline text-to-speech."
authors = ["Brandon Williams"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.16"
pyttsx3 = "^2.90"
ttkbootstrap = "^2.2.3"
ebooklib = "^0.20"
beautifulsoup4 = "^4.15.0"
mobi = "^0.4.1"
python-docx = "^1.2.0"
striprtf = "^0.0.33"
packaging = "^26.3"
pypdf = "^6.18.1"
ftfy = "^6.3.1"
pycaw = "^20251023"

[tool.poetry.group.dev.dependencies]
cx-freeze = "^8.7.0"
pillow = "^12.3.0"
pytest = "^9.1.1"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
