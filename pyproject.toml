[tool.poetry]
name = "talebrew"
version = "0.4.1"
description = "Talebrew: a proper Windows app that turns your heaviest reading into a flawless listening experience."
authors = ["Brandon Williams"]
package-mode = false

[tool.poetry.dependencies]
# Raised from 3.10 to 3.12: numpy only started publishing win_arm64 wheels (this
# project targets Windows on ARM64, per Converter.py's own comments about running under
# x64 emulation) at numpy 2.5, which requires Python >=3.12. numpy/sounddevice/soundfile
# are needed for AudioPlayer's live playback speed/tone control -- see AudioStretch.py.
python = ">=3.12,<3.16"
pyttsx3 = "^2.90"
ttkbootstrap = "^2.2.3"
ebooklib = "^0.20"
beautifulsoup4 = "^4.15.0"
mobi = "^0.4.1"
python-docx = "^1.2.0"
striprtf = "^0.0.33"
packaging = "^26.3"
pypdf = "^6.18.1"
ftfy = "^6.3.1"
pycaw = "^20251023"
sounddevice = "^0.5.1"
numpy = "^2.5.0"
# 0.14.0+ specifically: earlier win_arm64 wheels of soundfile didn't bundle libsndfile
# at all (relying on a system-installed copy via ctypes.util.find_library, which fails
# outright on a clean end-user machine) -- caught by actually building and inspecting
# the frozen .exe output, not by reading the dependency's changelog.
soundfile = "^0.14.0"

[tool.poetry.group.dev.dependencies]
cx-freeze = "^8.7.0"
pillow = "^12.3.0"
pytest = "^9.1.1"

# Optional: only needed to run mcp_server.py (an MCP server exposing Talebrew's
# conversion pipeline to AI agents like Claude Desktop/Claude Code). Deliberately kept
# out of [tool.poetry.dependencies] and out of setup.py's build_exe_options -- this is a
# developer/agent integration surface, not something every end user installing the
# desktop app needs bundled into the .msi. `optional = true` is what actually makes
# Poetry skip this group on a plain `poetry install` -- without it, a group installs by
# default the same as `dev`, silently defeating the whole point. Install with
# `poetry install --with mcp`.
[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
mcp = "^1.2.0"
# Platform-conditional, not a single hard pin: cryptography only ships prebuilt
# win_arm64 wheels through 46.0.3 (verified directly with `pip download --platform
# win_arm64 --only-binary=:all:` -- confirmed 46.0.4 already dropped win_arm64, not just
# 47.0.0+ as first thought), and 46.0.3 carries several since-disclosed CVEs (see
# GitHub's Dependabot alerts on this repo -- self-signed path-building, a PKCS#7
# Bleichenbacher oracle, an SECT-curve subgroup attack, among others). Pinning everyone
# to that old, vulnerable build just to accommodate one ARM64 dev machine would be
# irresponsible: the overwhelming majority of people setting up the MCP server are on
# x64, where the latest cryptography installs fine and has none of these issues. Poetry
# resolves each machine's own applicable constraint at install time.
cryptography = [
    { version = "46.0.3", markers = "platform_machine == 'ARM64'" },
    { version = ">=50.0.1", markers = "platform_machine != 'ARM64'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
