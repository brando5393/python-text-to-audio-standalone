[tool.poetry]
name = "python-text-to-audio"
version = "0.1.0"
description = "A desktop app that converts text and PDF files to audio using text-to-speech."
authors = ["Brandon Williams"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
PyPDF2 = "^3.0.1"
pyttsx3 = "^2.90"
ttkbootstrap = "^2.2.3"
ebooklib = "^0.20"
beautifulsoup4 = "^4.15.0"
mobi = "^0.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
